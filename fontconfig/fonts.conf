<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- SpaceMono Nerd Font as the default everywhere, Sarabun for Thai
     (SpaceMono has no Thai glyphs); system fonts remain as fallback. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>SpaceMono Nerd Font Propo</family>
      <family>Sarabun</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>SpaceMono Nerd Font Propo</family>
      <family>Sarabun</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>SpaceMono Nerd Font Mono</family>
      <family>Sarabun</family>
    </prefer>
  </alias>
  <!-- Text tagged as Thai (lang=th) uses Sarabun outright. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>th</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Sarabun</string></edit>
  </match>
</fontconfig>
